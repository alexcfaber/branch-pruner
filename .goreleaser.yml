version: 2
project_name: branch-pruner

builds:
  - id: branch-pruner
    main: ./cmd/branch-pruner
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    binary: branch-pruner
    env:
      - CGO_ENABLED=0

# Use default archives behavior; goreleaser will create compressed archives per build.
archives:
  - format: tar.gz
    wrap_in_directory: true

changelog:
  sort: desc

snapshot:
  name_template: "{{ .Tag }}-snapshot"

release:
  github:
    owner: alexcfaber
    name: branch-pruner
